<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<title>Άδεια Αγοράς — Ειδοποίηση</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, 'Segoe UI', sans-serif; color: #fff;
    background: linear-gradient(160deg, #0f2040, #1a365d);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px; text-align: center; -webkit-app-region: drag;
  }
  .icon { font-size: 32px; margin-bottom: 8px; }
  h1 { font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; color: #e8a020; margin-bottom: 16px; }
  .num { font-family: Consolas, 'Courier New', monospace; font-size: 26px; font-weight: 700; margin: 4px 0 14px; }
  .lixi-date { font-size: 12px; opacity: 0.75; margin-bottom: 14px; }
  .status-pill {
    display: inline-block; padding: 8px 18px; border-radius: 20px; font-weight: 700; font-size: 14px;
    margin-bottom: 18px; -webkit-app-region: no-drag; border: 1px solid;
  }
  button {
    -webkit-app-region: no-drag; background: rgba(255,255,255,0.12); color: #fff;
    border: 1px solid rgba(255,255,255,0.28); padding: 8px 22px; border-radius: 6px;
    font-size: 13px; font-weight: 600; cursor: pointer; transition: background 0.15s;
  }
  button:hover { background: rgba(255,255,255,0.22); }
  .loading { font-size: 13px; opacity: 0.6; }

  .tier-default { background: rgba(148,163,184,0.14); border-color: rgba(148,163,184,0.4); color: #94a3b8; }
  .tier-safe    { background: rgba(22,163,74,0.16);   border-color: rgba(22,163,74,0.35);  color: #16a34a; }
  .tier-notice  { background: rgba(245,158,11,0.15);  border-color: rgba(245,158,11,0.4);  color: #f59e0b; }
  .tier-warn    { background: rgba(217,119,6,0.16);   border-color: rgba(217,119,6,0.4);   color: #d97706; }
  .tier-urgent  { background: rgba(239,68,68,0.15);   border-color: rgba(239,68,68,0.4);   color: #ef4444; }
  .tier-expired { background: rgba(220,38,38,0.2);    border-color: rgba(220,38,38,0.5);   color: #dc2626; }
</style>
</head>
<body>
  <div id="loading" class="loading">Έλεγχος άδειας…</div>
  <div id="content" style="display:none">
    <div class="icon">📜</div>
    <h1>Άδεια Αγοράς σε Ισχύ</h1>
    <div class="num" id="num">—</div>
    <div class="lixi-date" id="lixi-date"></div>
    <div class="status-pill" id="status-pill"></div>
    <div><button id="close-btn">Κλείσιμο</button></div>
  </div>
<script>
  // Συνολικό budget από το άνοιγμα του splash (όχι μόνο από τη στιγμή που
  // φτάνουν τα δεδομένα άδειας) — αλλιώς ο χρόνος φόρτωσης (bridge startup +
  // get_adeies, ~2s στο dev) προστίθεται πάνω στον χρόνο εμφάνισης αντί να
  // επικαλύπτεται μαζί του, και ο χρήστης περιμένει διπλά.
  const SPLASH_START = Date.now();
  const TOTAL_BUDGET_MS = 5000;
  const MIN_VISIBLE_MS = 1500; // ελάχιστος χρόνος ορατότητας μετά τη φόρτωση

  function fmtDate(s) {
    if (!s) return '';
    const [y, m, d] = s.split('-');
    return `${d}/${m}/${y}`;
  }

  window.splashApi.onAdeiaInfo((data) => {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'block';
    document.getElementById('num').textContent = data.arithmos_adeias;

    const pill = document.getElementById('status-pill');
    const dateEl = document.getElementById('lixi-date');
    const d = data.days_left;
    let tier, text;

    if (d === null) {
      tier = 'tier-default'; text = 'Χωρίς καταχωρημένη ημ. λήξης'; dateEl.textContent = '';
    } else {
      dateEl.textContent = 'Λήξη: ' + fmtDate(data.imerominia_lixis);
      if (d < 0)        { tier = 'tier-expired'; text = `ΕΛΗΞΕ πριν ${-d} ημέρες`; }
      else if (d === 0) { tier = 'tier-urgent'; text = 'ΛΗΓΕΙ ΣΗΜΕΡΑ'; }
      else if (d <= 15) { tier = 'tier-urgent'; text = `${d} ημέρες απομένουν`; }
      else if (d <= 30) { tier = 'tier-warn';   text = `${d} ημέρες απομένουν`; }
      else if (d <= 90) { tier = 'tier-notice'; text = `${d} ημέρες απομένουν`; }
      else               { tier = 'tier-safe';   text = `${d} ημέρες απομένουν`; }
    }

    pill.className = 'status-pill ' + tier;
    pill.textContent = text;

    document.getElementById('close-btn').addEventListener('click', () => window.splashApi.close());
    const remaining = Math.max(MIN_VISIBLE_MS, TOTAL_BUDGET_MS - (Date.now() - SPLASH_START));
    setTimeout(() => window.splashApi.close(), remaining);
  });
</script>
</body>
</html>
